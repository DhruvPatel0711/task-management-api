services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: task_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: task_management
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_app -d task_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: dhruvpatel0711/task_management-api:1.0
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://task_app:${POSTGRES_PASSWORD_URLENC}@db:5432/task_management
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: